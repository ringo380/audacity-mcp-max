[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audacity-mcp-max"
version = "0.3.0"
description = "MCP server for AI-driven audio editing in Audacity via mod-script-pipe, with a reworked pipe layer"
license = "Apache-2.0"
authors = [
    { name = "Daniel Hodgetts" },
    { name = "Ryan Robson" },
]
readme = "README.md"
keywords = ["audacity", "mcp", "audio", "ai", "model-context-protocol", "mastering", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
# faster-whisper drags in ctranslate2 and onnxruntime and then downloads models
# on first use. That is a large, silent tax on someone who only wants to clean
# up a recording, so the 7 transcription tools ask for it explicitly instead.
transcription = [
    "faster-whisper>=1.0.0",
]
# LUFS and true peak need real signal processing: K-weighting is an IIR filter,
# so scipy.signal.sosfilt is what makes it viable on an hour of audio. Someone
# who only wants a cleanup pipeline should not pay for that, so the metrics
# degrade honestly without it.
measurement = [
    "numpy>=1.24",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["audacity_mcp", "audacity_mcp_shared"]

[project.scripts]
audacity-mcp-max = "audacity_mcp.main:main"
